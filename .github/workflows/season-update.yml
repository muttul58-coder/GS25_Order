name: 시즌 갱신

# 관리자가 Actions 탭에서 직접 실행합니다 (자동으로 돌지 않습니다).
# 하는 일: 시즌설정.txt 를 읽어 products.js / store.js / BarcodeImgs 를 다시 만들고
#          커밋합니다. main 에 커밋되면 GitHub Pages 가 알아서 재배포합니다.
#          season.json(구매혜택 아이콘 기억)도 스크립트가 갱신해 함께 커밋됩니다.
on:
  workflow_dispatch:
    # 입력 id 는 영문만 허용된다. 관리자에게 보이는 것은 description 이므로
    # 한글 안내는 그쪽에 적는다.
    inputs:
      rebuild_barcodes:
        description: "바코드도 다시 만들기 — 새 PDF를 올렸다면 체크 (601장 렌더링, 3~5분)"
        type: boolean
        default: true
      dry_run:
        description: "확인만 하기 — 커밋하지 않고 결과만 봅니다 (연습용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install pdfplumber pymupdf pillow

      - name: 설정 확인
        run: |
          echo "::group::시즌설정.txt"
          grep -vE '^[[:space:]]*(#|$)' 시즌설정.txt
          echo "::endgroup::"

      - name: 시즌 갱신 실행
        id: run
        run: |
          if [ "${{ inputs.rebuild_barcodes }}" = "true" ]; then
            python tools/update_season.py
          else
            python tools/update_season.py --skip-barcodes
          fi

      # 갱신이 멈춘 경우(모르는 아이콘 등) 확인용 그림을 남긴다
      - name: 모르는 아이콘 그림 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 확인이-필요한-아이콘
          path: unknown_benefit_icons.png
          if-no-files-found: ignore

      - name: 바뀐 내용 정리
        id: diff
        run: |
          rm -f unknown_benefit_icons.png
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "바뀐 내용이 없습니다."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::group::변경 파일"
            git status --short
            echo "::endgroup::"
          fi

      - name: 커밋 및 배포
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "시즌 갱신 (시즌설정.txt 기준 자동 생성)" \
            -m "실행: ${{ github.actor }} / 바코드 재생성: ${{ inputs.rebuild_barcodes }}"
          git push

      - name: 결과 안내
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" != "true" ]; then
            echo "### 바뀐 내용이 없습니다" >> $GITHUB_STEP_SUMMARY
            echo "시즌설정.txt 를 저장하셨는지 확인해 주세요." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### 확인만 하기 모드 - 커밋하지 않았습니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 갱신 완료" >> $GITHUB_STEP_SUMMARY
            echo "1~2분 뒤 주문서에 반영됩니다. 열려 있던 화면은 Ctrl+F5 로 새로고침하세요." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "https://muttul58-coder.github.io/GS25_Order/order_form.html" >> $GITHUB_STEP_SUMMARY
          fi
